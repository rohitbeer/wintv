<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>WinTV</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="access.css">
</head>
<body>
  <div id="wall" aria-hidden="true">
    <div id="wall-move">
      <div class="wall-img" id="wall-a"></div>
      <div class="wall-img" id="wall-b"></div>
      <div id="wall-blur"></div>
    </div>
    <div id="wall-shade"></div>
  </div>

  <div id="shelf" aria-hidden="true">
    <div class="art" id="art-a"></div>
    <div class="art" id="art-b"></div>
    <div class="shade"></div>
  </div>

  <header>
    <div id="me"></div>
    <div id="weather"></div>
    <div id="clock"></div>
  </header>

  <section id="info" aria-live="polite">
    <div id="eyebrow"></div>
    <h1 id="title"></h1>
    <p id="tagline"></p>
  </section>

  <main id="rows"></main>

  <div id="settings" class="hidden" role="dialog" aria-modal="true">
    <div class="set-side">
      <div class="set-title">Settings</div>
      <div id="set-sections"></div>
    </div>
    <div class="set-main">
      <h2 id="set-heading"></h2>
      <div id="set-rows"></div>
      <p id="set-note"></p>
    </div>
  </div>

  <div id="sheet" class="hidden" role="dialog" aria-modal="true">
    <div class="panel">
      <h2 id="sheet-title"></h2>
      <div id="sheet-items"></div>
    </div>
  </div>

  <div id="picker" class="hidden" role="dialog" aria-modal="true">
    <div class="who">Who’s watching?</div>
    <div id="faces"></div>
    <div class="who-hint">Each profile keeps its own app sign-ins.</div>
  </div>

  <div id="lock" class="hidden" data-spot="0" aria-hidden="true">
    <div class="art" id="lock-a"></div>
    <div class="art" id="lock-b"></div>
    <div class="lock-shade"></div>
    <div id="lock-clock">
      <div id="lock-time"></div>
      <div id="lock-date"></div>
      <div id="lock-weather"></div>
    </div>
    <div id="lock-hint">Press any button</div>
    <div id="lock-credit"></div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="prefs.js"></script>
  <script src="app.js"></script>
</body>
</html>
